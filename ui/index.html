<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CXPS5</title>
<style>
:root{--bg:#0c0f16;--panel:#151a25;--panel2:#1b2130;--line:#283044;--tx:#e9ecf3;--mu:#8d97ad;--red:#ff3b5c;--amb:#ffb02e;--grn:#35d49a;--blu:#5aa7ff;
--disp:"Bahnschrift","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--body)}
body{min-height:100vh;padding:calc(env(safe-area-inset-top,0px)) 0 calc(76px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#0c0f16 78%,#0c0f1600);padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;display:flex;align-items:center;gap:12px}
.mark{font:italic 800 30px/1 var(--disp);letter-spacing:.02em;position:relative;padding-right:14px;margin-right:2px}
.mark::after{content:"";position:absolute;right:0;top:-2px;bottom:-2px;width:5px;transform:skewX(-18deg);background:repeating-linear-gradient(var(--red) 0 7px,transparent 7px 11px)}
.pill{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mu);background:var(--panel);border:1px solid var(--line);padding:6px 11px;border-radius:99px;max-width:58%}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mu);flex:none}.dot.ok{background:var(--grn);box-shadow:0 0 8px var(--grn)}.dot.bad{background:var(--red)}.dot.warn{background:var(--amb)}
main{padding:4px 16px 0;max-width:760px;margin:0 auto}
h2{font:700 22px/1.1 var(--disp);margin:14px 2px 12px;letter-spacing:.01em}
.sub{color:var(--mu);margin:-6px 2px 14px;font-size:13.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.tile{width:46px;height:46px;border-radius:10px;flex:none;display:grid;place-items:center;font:800 18px var(--disp);color:#0c0f16;transform:skewX(-8deg)}
.tile i{transform:skewX(8deg);font-style:normal}
.grow{flex:1;min-width:0}
.name{font-weight:650;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--mu);font-size:12.5px}
.sw{position:relative;width:48px;height:28px;flex:none}.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;z-index:2}
.sw b{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:99px;transition:.18s}
.sw b::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:.18s}
.sw input:checked+b{background:#3a1520;border-color:var(--red)}.sw input:checked+b::after{left:23px;background:var(--red)}
.sw input:focus-visible+b{outline:2px solid var(--blu);outline-offset:2px}
.files{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;display:none}.open .files{display:block}
.f{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;border-bottom:1px dashed #222a3b}.f:last-child{border:0}
.f .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mu);white-space:nowrap}
.chip.g{color:var(--grn);border-color:#1f5c48}.chip.a{color:var(--amb);border-color:#6b4c12}.chip.r{color:var(--red);border-color:#6b2030}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button,.btn{font:600 14px var(--body);color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:42px;cursor:pointer}
button:active{transform:translateY(1px)}button:focus-visible,.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
.pri{background:var(--red);border-color:var(--red);color:#fff}.dng{color:var(--red)}.sm{padding:6px 11px;min-height:34px;font-size:13px}
input[type=text],input[type=url],input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px 12px;font:15px var(--body);margin:6px 0 10px}
label.l{font-size:13px;color:var(--mu)}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:26px 14px;text-align:center;color:var(--mu);cursor:pointer;background:repeating-linear-gradient(-45deg,transparent 0 12px,#ffffff05 12px 24px)}
.drop.hot{border-color:var(--red);color:var(--tx)}.drop strong{display:block;color:var(--tx);font:700 18px var(--disp);margin-bottom:4px}
.bar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
.note{border-left:3px solid var(--amb);background:#2a2110;padding:10px 12px;border-radius:0 10px 10px 0;font-size:13px;margin:0 0 12px}
.note.i{border-color:var(--blu);background:#10202f}
.apply{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;max-width:736px;margin:0 auto;background:var(--panel);border:1px solid var(--red);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 28px #000a}
.apply.busy .pri{background:repeating-linear-gradient(-45deg,var(--red) 0 10px,#c42a47 10px 20px);background-size:200% 100%;animation:run .8s linear infinite}
@keyframes run{to{background-position:28px 0}}@media (prefers-reduced-motion:reduce){.apply.busy .pri{animation:none}}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:#0c0f16f2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(8px)}
nav button{flex:1;border:0;background:none;border-radius:0;color:var(--mu);padding:12px 4px 10px;font:600 12.5px var(--body);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--tx);box-shadow:inset 0 3px 0 var(--red)}
.empty{text-align:center;color:var(--mu);padding:36px 12px}.empty strong{display:block;font:700 20px var(--disp);color:var(--tx);margin-bottom:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}.kv dt{color:var(--mu)}.kv dd{margin:0;word-break:break-all}
pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto;color:#b9c2d6}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:20;max-width:90%;font-size:14px;box-shadow:0 8px 28px #000a}
.toast.e{border-color:var(--red)}
details summary{cursor:pointer;color:var(--mu);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<header><div class="mark">CXPS5</div><div class="pill"><i class="dot" id="dot"></i><span id="gname">Looking for the game…</span></div></header>
<main id="view"></main>
<div id="applybar"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mb=n=>n>=1073741824?(n/1073741824).toFixed(2)+' GB':n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const ICON={garage:'<path d="M3 11l9-7 9 7v9H3z"/><path d="M8 20v-6h8v6"/>',add:'<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>',browse:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',sys:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'};
const TABS=[['garage','Garage'],['add','Add'],['browse','Browse'],['sys','System']];
let S={diag:[],tab:'garage',status:null,mods:[],pending:false,open:{},jobs:[],up:[],catalog:null,log:'',busy:false};

function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' e':'');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),e?5200:2600)}
async function api(path,opt={}){
  const h={...(opt.headers||{})};const pin=localStorage.getItem('cxps5pin');if(pin)h['X-CXPS5-PIN']=pin;
  const r=await fetch('/api/'+path,{...opt,headers:h});let j={};try{j=await r.json()}catch(e){}
  if(r.status===401){const p=prompt('Enter your CXPS5 PIN');if(p){localStorage.setItem('cxps5pin',p);return api(path,opt)}throw new Error('PIN required')}
  if(!r.ok)throw new Error(j.error||('Error '+r.status));return j}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b||{})});

function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h%360}
function chip(c,mine,stock){
  const m={same:['g','Unity version matches'],differs:['a','Unity version differs'],nomatch:['a','No matching game file'],invalid:['r','Not a valid bundle'],unknown:['','Game file unreadable']}[c]||['',c];
  return `<span class="chip ${m[0]}" title="${esc(mine)} vs game ${esc(stock)}">${m[1]}</span>`}

async function refresh(){
  try{S.status=await api('status');const m=await api('mods');S.mods=m.mods;S.pending=m.pending;S.diag=(await api('diag')).findings}catch(e){toast(e.message,1)}
  draw()}

function draw(){
  const g=S.status&&S.status.game;
  $('#dot').className='dot '+(!g?'':g.found?(g.running?'warn':'ok'):'bad');
  $('#gname').textContent=!g?'Connecting…':g.found?((g.name||'CarX Street')+(g.running?' · running':'')):'Game not found';
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}" aria-label="${l}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${l}</button>`).join('');
  $('#view').innerHTML=({garage:vGarage,add:vAdd,browse:vBrowse,sys:vSys})[S.tab]();
  const n=S.mods.filter(m=>m.enabled).length;
  $('#applybar').innerHTML=(S.pending&&S.tab!=='add')?`<div class="apply ${S.busy?'busy':''}"><div class="grow"><b>Changes not applied</b><div class="meta">The game still uses its original files</div></div><button class="pri" data-act="apply" ${S.busy?'disabled':''}>${S.busy?'Applying…':'Apply to game'}</button></div>`:'';
}

function vGarage(){
  const g=S.status&&S.status.game;
  let h='<h2>Garage</h2>';
  if(g&&!g.found)h+='<div class="note">CarX Street was not found on this console. Open <b>System</b> to set the game folder.</div>';
  else if(g&&!g.writable)h+='<div class="note">The game folder is read-only for this payload, so swapping files will fail. See System for details.</div>';
  if(!S.mods.length)return h+`<div class="empty"><strong>No mods yet</strong>Add car, rim or audio bundles and they will show up here.<div class="tools" style="justify-content:center"><button class="pri" data-tab="add">Add a mod</button></div></div>`;
  h+='<p class="sub">Higher priority wins when two mods replace the same file.</p>';
  for(const m of S.mods){
    const warn=m.files.some(f=>f.compat==='nomatch'||f.compat==='differs'||f.compat==='invalid');
    h+=`<div class="card ${S.open[m.id]?'open':''}" data-id="${esc(m.id)}"><div class="row">
      <div class="tile" style="background:hsl(${hue(m.id)} 80% 62%)"><i>${esc(m.name.trim().slice(0,2).toUpperCase())}</i></div>
      <div class="grow" data-act="toggle"><div class="name">${esc(m.name)}</div>
      <div class="meta">${m.files.length} file${m.files.length==1?'':'s'} · ${mb(m.bytes)} · ${m.applied?m.applied+' in game':'not in game'}${warn?' · <span style="color:var(--amb)">check files</span>':''}</div></div>
      <label class="sw"><input type="checkbox" data-act="enable" ${m.enabled?'checked':''} aria-label="Enable ${esc(m.name)}"><b></b></label></div>
      <div class="files">${m.files.map(f=>`<div class="f"><span class="fn">${esc(f.name)}</span><span class="meta">${mb(f.size)}</span>${chip(f.compat,f.engine,f.stockEngine)}</div>`).join('')||'<div class="meta">No bundle files</div>'}
      <div class="tools"><button class="sm" data-act="up">Priority ▲</button><button class="sm" data-act="down">Priority ▼</button><button class="sm" data-act="rename">Rename</button><button class="sm dng" data-act="del">Delete</button></div>
      <div class="meta" style="margin-top:8px">Priority ${m.priority}${m.source?' · from '+esc(m.source.slice(0,60)):''}</div></div></div>`}
  return h}

function vAdd(){
  const running=S.jobs.filter(j=>j.state==='running');
  return `<h2>Add a mod</h2>
  <p class="sub">CarX Street Workshop mods are folders of <b>.bundle</b> files. Pick the files, a folder, or a .zip of them.</p>
  <label class="l" for="mname">Mod name</label><input type="text" id="mname" placeholder="e.g. Nissan Silvia S15" autocomplete="off">
  <label class="drop" id="drop"><input type="file" id="pick" multiple accept=".bundle,.zip" hidden><strong>Drop files or tap to choose</strong>.bundle files or a .zip</label>
  <div class="tools"><label class="btn sm">Choose a folder<input type="file" id="pickdir" webkitdirectory hidden></label></div>
  <div id="ups">${S.up.map(u=>`<div class="card"><div class="row"><div class="grow"><div class="name">${esc(u.name)}</div><div class="meta">${esc(u.msg)}</div></div></div><div class="bar"><i style="width:${u.pct}%"></i></div></div>`).join('')}</div>
  <details class="card"><summary>Where do I find Steam Workshop files?</summary><p class="meta">On your PC, subscribe to the mod on the CarX Street Workshop, then open <b>Steam\\steamapps\\workshop\\content\\1114150\\&lt;item id&gt;</b>. Select that folder here, or zip it first. Bundles made for the PC build may show pink or invisible parts on PS5 (shaders are platform specific), but meshes and audio often work.</p></details>
  <h2>From a link</h2>
  ${S.status&&S.status.curl?`<label class="l" for="url">Direct link to a .bundle or .zip</label><input type="url" id="url" placeholder="https://…" autocomplete="off">
  <div class="tools"><button class="pri" data-act="fetch">Download to console</button></div>
  ${running.map(j=>`<div class="card"><div class="name">${esc(j.name)}</div><div class="meta">${j.pct}%</div><div class="bar"><i style="width:${j.pct}%"></i></div></div>`).join('')}
  ${S.jobs.filter(j=>j.state!=='running').slice(-2).map(j=>`<div class="note ${j.state==='done'?'i':''}"><b>${esc(j.name)}</b>: ${esc(j.msg)}</div>`).join('')}`
  :'<div class="note i">This build has no download support. Upload files from your device instead.</div>'}`}

function vBrowse(){
  if(S.catalog===null){loadCatalog();return '<h2>Browse</h2><div class="empty">Loading…</div>'}
  if(!S.catalog.length)return `<h2>Browse</h2><div class="empty"><strong>No catalog set</strong>Put a catalog link in <b>config.ini</b> (<code>catalog_url=</code>) to browse cars from here. It is a JSON file: {"items":[{"name","author","url","note"}]}.</div>`;
  return '<h2>Browse</h2>'+S.catalog.map((c,i)=>`<div class="card"><div class="row"><div class="tile" style="background:hsl(${hue(c.name||'x')} 80% 62%)"><i>${esc((c.name||'?').slice(0,2).toUpperCase())}</i></div><div class="grow"><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.author||'')} ${esc(c.note||'')}</div></div><button class="sm pri" data-act="cat" data-i="${i}">Install</button></div></div>`).join('')}

function vSys(){
  const s=S.status||{},g=s.game||{};
  return `<h2>System</h2>
  <div class="note">Offline play only. CarX Street can refuse to log in with modified bundles, so keep modded installs away from online and ranked modes.</div>
  <div class="card"><dl class="kv"><dt>Game</dt><dd>${g.found?esc(g.name||'CarX Street')+' '+esc(g.titleId||''):'not found'}</dd><dt>Folder</dt><dd>${esc(g.root||'—')}</dd><dt>Bundles</dt><dd>${g.bundles??0} indexed</dd><dt>Writable</dt><dd>${g.writable?'yes':'no'}</dd><dt>Running</dt><dd>${g.running?'yes, close it before applying':'no'}</dd><dt>In game</dt><dd>${s.applied??0} swapped file(s)</dd><dt>Version</dt><dd>${esc(g.version||'unknown')}</dd><dt>CXPS5</dt><dd>${esc(s.version||'')}</dd></dl>
  <div class="tools"><button data-act="scan">Rescan game</button><button class="dng" data-act="restore">Restore originals</button></div></div>
  <div class="card"><div class="name">Checks</div>${S.diag.length?S.diag.map(l=>{const k=l.split(' ')[0],c=k==='ERROR'?'r':k==='WARN'?'a':'';return `<div class="f"><span class="chip ${c}">${esc(k)}</span><span style="flex:1">${esc(l.slice(k.length+1))}</span></div>`}).join(''):'<div class="meta">No problems detected.</div>'}
  <div class="tools"><button class="pri sm" data-act="dl">Download report</button></div><div class="meta" style="margin-top:8px">The report has game version, every swapped file, Unity version checks and the full log. Send it when something crashes.</div></div>
  <div class="card"><div class="name">Security PIN</div><div class="meta">Anyone on your network can open this page. Set <code>pin=</code> in config.ini to lock it.</div>${s.pin?'<div class="tools"><button class="sm" data-act="pin">Change saved PIN</button></div>':''}</div>
  <div class="card"><div class="name">Log</div><pre id="log">${esc(S.log||'Tap refresh')}</pre><div class="tools"><button class="sm" data-act="log">Refresh log</button></div></div>`}

async function loadCatalog(){try{const c=await api('catalog');S.catalog=c.items||[]}catch(e){S.catalog=[];toast(e.message,1)}if(S.tab==='browse')draw()}

function slug(s){return (s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'mod')+'-'+Math.random().toString(36).slice(2,6)}
function put(path,file,onp){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('PUT','/api/'+path);const p=localStorage.getItem('cxps5pin');if(p)x.setRequestHeader('X-CXPS5-PIN',p);
  x.upload.onprogress=e=>e.lengthComputable&&onp(Math.round(e.loaded/e.total*100));
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}x.status<300?res(j):rej(new Error(j.error||('Error '+x.status)))};x.onerror=()=>rej(new Error('Connection lost'));x.send(file)})}

async function upload(files){
  files=[...files];const ok=files.filter(f=>/\.(bundle|zip)$/i.test(f.name));
  if(!ok.length)return toast('Only .bundle or .zip files are used',1);
  let name=($('#mname')&&$('#mname').value.trim())||'';
  if(!name){const rp=files[0].webkitRelativePath;name=rp?rp.split('/')[0]:ok[0].name.replace(/\.(bundle|zip)$/i,'')}
  const id=slug(name);S.tab='add';
  for(const f of ok){const u={name:f.name,msg:'Uploading… '+mb(f.size),pct:0};S.up.push(u);draw();
    try{const z=/\.zip$/i.test(f.name),q='?modname='+encodeURIComponent(name);
      await put(z?`mods/${id}/zip${q}`:`mods/${id}/files/${encodeURIComponent(f.name)}${q}`,f,p=>{u.pct=p;const b=document.querySelectorAll('#ups .bar i');if(b[S.up.indexOf(u)])b[S.up.indexOf(u)].style.width=p+'%'});
      u.pct=100;u.msg='Added'}catch(e){u.msg=e.message;u.pct=0;toast(e.message,1)}}
  await refresh();S.up=[];toast('Added to your garage. Enable it, then Apply.');S.tab='garage';draw()}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;if(S.tab==='browse')S.catalog=null;return draw()}
  const card=t.closest('.card'),id=card&&card.dataset.id,m=S.mods.find(x=>x.id===id),a=t.dataset.act;
  try{
  if(a==='toggle'){S.open[id]=!S.open[id];card.classList.toggle('open')}
  else if(a==='enable')return;
  else if(a==='up'||a==='down'){await post('mods/'+id,{priority:m.priority+(a==='up'?1:-1)});await refresh()}
  else if(a==='rename'){const n=prompt('Mod name',m.name);if(n){await post('mods/'+id,{name:n});await refresh()}}
  else if(a==='del'){if(confirm('Delete “'+m.name+'”? Files it swapped into the game are put back on the next Apply.')){await api('mods/'+id,{method:'DELETE'});await refresh()}}
  else if(a==='apply'||a==='restore'){
    if(a==='restore'&&!confirm('Put every original game file back?'))return;
    S.busy=true;draw();
    try{const r=await post(a,{});
      const bad=r.errors&&r.errors.length;toast(bad?r.errors[0]:(a==='restore'?'Originals restored':`${r.applied} file(s) in game`+(r.unmatched.length?`, ${r.unmatched.length} had no match`:'')),bad);
      if(r.unmatched&&r.unmatched.length)toast('No matching game file for: '+r.unmatched.slice(0,3).join(', '),1)}
    catch(er){toast(er.message,1)}S.busy=false;await refresh()}
  else if(a==='dl'){const h={},pn=localStorage.getItem('cxps5pin');if(pn)h['X-CXPS5-PIN']=pn;const r=await fetch('/api/report',{headers:h});if(!r.ok)throw new Error('Could not get the report');const url=URL.createObjectURL(await r.blob()),l=document.createElement('a');l.href=url;l.download='cxps5-report.txt';document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),8000)}
  else if(a==='scan'){await post('scan');await refresh();toast('Scanned')}
  else if(a==='log'){S.log=(await api('log')).log;draw()}
  else if(a==='pin'){const p=prompt('PIN');if(p!==null){localStorage.setItem('cxps5pin',p);refresh()}}
  else if(a==='fetch'){const url=$('#url').value.trim(),name=$('#mname').value.trim()||url.split('/').pop().split('?')[0].replace(/\.(bundle|zip)$/i,'')||'Download';
    if(!url)return toast('Paste a link first',1);await post('fetch',{url,name,id:slug(name)});pollJobs()}
  else if(a==='cat'){const c=S.catalog[+t.dataset.i];await post('fetch',{url:c.url,name:c.name,id:slug(c.name),file:c.file||''});toast('Downloading '+c.name);S.tab='add';pollJobs()}
  }catch(er){toast(er.message,1)}});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.act==='enable'){const id=t.closest('.card').dataset.id;try{await post('mods/'+id,{enabled:t.checked});await refresh()}catch(er){toast(er.message,1)}}
  if(t.id==='pick'||t.id==='pickdir'){upload(t.files);t.value=''}});
document.addEventListener('dragover',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('hot')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('#drop');if(d)d.classList.remove('hot')});
document.addEventListener('drop',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('hot');upload(e.dataTransfer.files)}});

let polling=false;
async function pollJobs(){if(polling)return;polling=true;
  for(let i=0;i<600;i++){try{S.jobs=(await api('jobs')).jobs}catch(e){break}draw();if(!S.jobs.some(j=>j.state==='running'))break;await new Promise(r=>setTimeout(r,1500))}
  polling=false;await refresh()}
refresh();setInterval(()=>{if(!S.busy&&S.tab!=='add')refresh()},15000);
</script>
</body>
